<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Иркутск. Не торопись тыкать</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="img/01_zima_ul_Gryaznova.webp" />
  <link rel="preload" as="image" href="img/02_Irkutsk_s_vysoty.webp" />
  <link rel="preload" as="image" href="img/04_Baikal_Listvyanka.webp" />
  <link rel="preload" as="image" href="img/04_Moskovskie_vorota.webp" />
  <link rel="preload" as="image" href="img/05_derevyanny_osobnyak.webp" />
  <link rel="preload" as="image" href="img/05_staroe_derevo_vorota.webp" />
  <link rel="preload" as="image" href="img/06_ploshchad_centr.webp" />
  <link rel="preload" as="image" href="img/07_130_kvartal_ulica.webp" />
  <link rel="preload" as="image" href="img/07_ledokol_Angara.webp" />
  <link rel="preload" as="image" href="img/08_reznoj_dom_zima.webp" />
  <link rel="preload" as="image" href="img/10_dom_Volkonskih_ili_pohozh.webp" />
  <link rel="preload" as="image" href="img/10_muzej_Trubeckih_zal.webp" />
  <link rel="preload" as="image" href="img/NE_Irkutsk_Talcy_ostrog.webp" />
  <style>
    :root {
      --ink: #2a1c12;
      --ink-soft: #4a3728;
      --paper: #f3e6cf;
      --paper-2: #e8d4b0;
      --gold: #c4a05a;
      --gold-dark: #8a6a32;
      --wrong: #7a2e24;
      --right: #2f5a38;
      --veil: rgba(28, 18, 10, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #1a120c;
      color: var(--paper);
      font-family: "Source Serif 4", Georgia, serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .phone {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: #1a120c;
      filter: grayscale(0.35) sepia(0.35) contrast(0.92) brightness(0.7);
      transform: scale(1.06);
      opacity: 0;
      z-index: 0;
    }
    .bg.show { opacity: 1; }
    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(20,12,6,0.82) 0%, var(--veil) 38%, var(--veil) 70%, rgba(14,9,5,0.9) 100%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,230,180,0.015) 3px);
    }
    .frame {
      position: absolute;
      inset: 10px;
      z-index: 1;
      pointer-events: none;
      border: 2px solid rgba(196,160,90,0.55);
      box-shadow:
        inset 0 0 0 1px rgba(42,28,18,0.6),
        inset 0 0 0 6px rgba(243,230,207,0.08);
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 54px;
      height: 54px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.85;
    }
    .frame::before {
      top: -2px; left: -2px;
      border-width: 3px 0 0 3px;
      border-top-left-radius: 4px;
    }
    .frame::after {
      bottom: -2px; right: -2px;
      border-width: 0 3px 3px 0;
    }
    .flourish {
      position: absolute;
      width: 72px;
      height: 28px;
      opacity: 0.8;
      z-index: 1;
      pointer-events: none;
    }
    .flourish svg { width: 100%; height: 100%; display: block; }
    .fl-tl { top: 6px; left: 8px; }
    .fl-tr { top: 6px; right: 8px; transform: scaleX(-1); }
    .fl-bl { bottom: 6px; left: 8px; transform: scaleY(-1); }
    .fl-br { bottom: 6px; right: 8px; transform: scale(-1); }

    .sheet {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      padding: calc(28px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .author-top {
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
      margin: 6px 18px 12px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 700;
      font-size: clamp(34px, 9vw, 46px);
      line-height: 0.95;
      text-align: center;
      color: #f7ead3;
      text-shadow: 0 2px 16px rgba(0,0,0,0.55);
    }
    .subtitle {
      text-align: center;
      font-style: italic;
      color: #d9c4a0;
      margin-top: 10px;
      font-size: 15px;
    }
    .grow { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .meta {
      text-align: center;
      font-size: 13px;
      color: #cbb894;
      letter-spacing: 0.04em;
    }
    .ig {
      display: block;
      text-align: center;
      margin-top: auto;
      padding-top: 16px;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.16em;
      font-size: 13px;
      text-transform: lowercase;
    }
    .ig:hover { color: #e8d08a; }

    .btn {
      display: block;
      width: 100%;
      border: 1px solid var(--gold-dark);
      background:
        linear-gradient(180deg, #f0ddb8 0%, #d7b57a 48%, #c4a05a 100%);
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 16px;
      border-radius: 2px;
      box-shadow:
        0 1px 0 rgba(255,240,210,0.45) inset,
        0 8px 18px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }

    .q-num {
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .question {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(18px, 5.2vw, 24px);
      line-height: 1.2;
      text-align: center;
      color: #f6ead4;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      margin-bottom: 18px;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      width: 100%;
      text-align: left;
      border: 1px solid rgba(196,160,90,0.55);
      background: rgba(243,230,207,0.14);
      backdrop-filter: blur(6px);
      color: #f3e6cf;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 16px;
      line-height: 1.3;
      padding: 12px 14px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
    }
    .opt span.key {
      display: inline-block;
      width: 1.4em;
      color: var(--gold);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 700;
    }
    .opt.right {
      background: rgba(47,90,56,0.72);
      border-color: #9dcc9a;
    }
    .opt.wrong {
      background: rgba(122,46,36,0.7);
      border-color: #e0a090;
    }
    .opt:disabled { cursor: default; }

    .score-big {
      text-align: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 64px;
      line-height: 1;
      color: var(--gold);
    }
    .answers {
      max-height: 52dvh;
      overflow: auto;
      font-size: 14px;
      line-height: 1.45;
      color: #ead9b8;
      padding-right: 4px;
    }
    .answers b { color: #f7ead3; }
    .answers p { margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(196,160,90,0.2); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg" id="bgA"></div>
    <div class="bg" id="bgB"></div>
    <div class="veil"></div>
    <div class="frame"></div>
    <div class="flourish fl-tl"><svg viewBox="0 0 120 40" fill="none"><path d="M4 28c18-2 22-20 38-20 10 0 12 8 22 8 14 0 20-14 52-14" stroke="#c4a05a" stroke-width="2.2"/><path d="M8 32c16 0 20-16 34-16 12 0 14 10 24 10" stroke="#c4a05a" stroke-width="1.2" opacity=".7"/></svg></div>
    <div class="flourish fl-tr"><svg viewBox="0 0 120 40" fill="none"><path d="M4 28c18-2 22-20 38-20 10 0 12 8 22 8 14 0 20-14 52-14" stroke="#c4a05a" stroke-width="2.2"/><path d="M8 32c16 0 20-16 34-16 12 0 14 10 24 10" stroke="#c4a05a" stroke-width="1.2" opacity=".7"/></svg></div>
    <div class="flourish fl-bl"><svg viewBox="0 0 120 40" fill="none"><path d="M4 28c18-2 22-20 38-20 10 0 12 8 22 8 14 0 20-14 52-14" stroke="#c4a05a" stroke-width="2.2"/></svg></div>
    <div class="flourish fl-br"><svg viewBox="0 0 120 40" fill="none"><path d="M4 28c18-2 22-20 38-20 10 0 12 8 22 8 14 0 20-14 52-14" stroke="#c4a05a" stroke-width="2.2"/></svg></div>

    <div class="sheet" id="sheet"></div>
  </div>

  <script src="questions.js"></script>
  <script>
    const PHOTOS = [
      "img/01_zima_ul_Gryaznova.webp",
      "img/02_Irkutsk_s_vysoty.webp",
      "img/04_Baikal_Listvyanka.webp",
      "img/04_Moskovskie_vorota.webp",
      "img/05_derevyanny_osobnyak.webp",
      "img/05_staroe_derevo_vorota.webp",
      "img/06_ploshchad_centr.webp",
      "img/07_130_kvartal_ulica.webp",
      "img/07_ledokol_Angara.webp",
      "img/08_reznoj_dom_zima.webp",
      "img/10_dom_Volkonskih_ili_pohozh.webp",
      "img/10_muzej_Trubeckih_zal.webp",
      "img/NE_Irkutsk_Talcy_ostrog.webp"
    ];

    const BANK = window.QUESTIONS;

    const LETTERS = ["А", "Б", "В", "Г"];
    let i = 0;
    let score = 0;
    let locked = false;
    let deck = [];
    let round = [];

    function shuffle(arr) {
      const a = arr.slice();
      for (let k = a.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [a[k], a[j]] = [a[j], a[k]];
      }
      return a;
    }

    function shuffleOptions(item) {
      const pack = item.options.map((text, idx) => ({ text, correct: idx === item.a }));
      const mixed = shuffle(pack);
      const options = mixed.map((p) => p.text);
      const bothAt = options.findIndex((t) => t.indexOf("оба варианта") === 0);
      if (bothAt !== -1) {
        const refs = [];
        item.options.forEach((text, idx) => {
          if (idx === item.a || text.indexOf("оба варианта") === 0) return;
          if (idx === 1 || idx === 2) {
            const pos = options.indexOf(text);
            if (pos !== -1) refs.push(LETTERS[pos]);
          }
        });
        refs.sort((x, y) => LETTERS.indexOf(x) - LETTERS.indexOf(y));
        if (refs.length === 2) options[bothAt] = "оба варианта " + refs[0] + " и " + refs[1];
      }
      return {
        q: item.q,
        options,
        a: mixed.findIndex((p) => p.correct),
        why: item.why
      };
    }

    function deal() {
      round = shuffle(BANK).map(shuffleOptions);
    }

    function mixPhotos(need) {
      const out = [];
      while (out.length < need) {
        const batch = shuffle(PHOTOS);
        if (out.length && batch.length > 1 && batch[0] === out[out.length - 1]) {
          const swap = batch.findIndex((p, idx) => idx > 0 && p !== out[out.length - 1]);
          if (swap > 0) [batch[0], batch[swap]] = [batch[swap], batch[0]];
        }
        out.push(...batch);
      }
      return out.slice(0, need);
    }

    function photoFor(n) {
      const need = (round.length || BANK.length) + 2;
      if (!deck.length) deck = mixPhotos(need);
      return deck[n % deck.length];
    }

    const cache = Object.create(null);
    const layers = [
      document.getElementById("bgA"),
      document.getElementById("bgB")
    ];
    let front = 0;
    let lastSrc = "";
    const sheet = document.getElementById("sheet");

    function warm(src) {
      if (!cache[src]) {
        cache[src] = new Promise((resolve) => {
          const im = new Image();
          im.onload = () => {
            const done = () => resolve(src);
            if (im.decode) im.decode().then(done, done);
            else done();
          };
          im.onerror = () => resolve(src);
          im.src = src;
        });
      }
      return cache[src];
    }

    PHOTOS.forEach(warm);

    async function showBg(src) {
      await warm(src);
      if (lastSrc === src && layers[front].classList.contains("show")) return;
      const back = layers[front].classList.contains("show") ? 1 - front : front;
      layers[back].style.backgroundImage = 'url("' + src + '")';
      layers[back].classList.add("show");
      if (back !== front) {
        layers[front].classList.remove("show");
        front = back;
      }
      lastSrc = src;
    }

    function startScreen() {
      deck = mixPhotos(BANK.length + 2);
      showBg(photoFor(0));
      sheet.innerHTML = `
        <div class="author-top">Александр Ростов</div>
        <div class="rule"></div>
        <div class="grow">
          <h1>Иркутск.<br>Не торопись тыкать</h1>
          <p class="subtitle">40 вопросов. история, власть, шанхайка, трамваи</p>
        </div>
        <button class="btn" id="go">Начать игру</button>
        <a class="ig" href="https://instagram.com/rostov.av" target="_blank" rel="noopener">instagram: rostov.av</a>
      `;
      document.getElementById("go").onclick = () => {
        i = 0; score = 0;
        deal();
        deck = mixPhotos(round.length + 2);
        renderQ();
      };
    }

    async function renderQ() {
      locked = false;
      const item = round[i];
      await showBg(photoFor(i));
      if (i + 1 < round.length) warm(photoFor(i + 1));
      sheet.innerHTML = `
        <div class="author-top">Александр Ростов</div>
        <div class="q-num">вопрос ${i + 1} из ${round.length}</div>
        <div class="rule"></div>
        <p class="question">${item.q}</p>
        <div class="options" id="opts"></div>
        <a class="ig" href="https://instagram.com/rostov.av" target="_blank" rel="noopener">rostov.av</a>
      `;
      const box = document.getElementById("opts");
      item.options.forEach((text, idx) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = `<span class="key">${LETTERS[idx]}</span> ${text}`;
        b.onclick = () => choose(idx, b);
        box.appendChild(b);
      });
    }

    function choose(idx, btn) {
      if (locked) return;
      locked = true;
      const item = round[i];
      const buttons = [...document.querySelectorAll(".opt")];
      buttons.forEach((el, n) => {
        el.disabled = true;
        if (n === item.a) el.classList.add("right");
      });
      if (idx === item.a) {
        score += 1;
      } else {
        btn.classList.add("wrong");
      }
      const next = i + 1;
      if (next < round.length) warm(photoFor(next));
      setTimeout(() => {
        i += 1;
        if (i < round.length) renderQ();
        else results();
      }, 850);
    }

    async function results() {
      await showBg(photoFor(Math.floor(Math.random() * PHOTOS.length)));
      sheet.innerHTML = `
        <div class="author-top">Александр Ростов</div>
        <div class="rule"></div>
        <div class="grow">
          <p class="q-num">итог</p>
          <div class="score-big">${score} / ${round.length}</div>
          <p class="subtitle" style="margin-bottom:22px">${verdict(score)}</p>
          <button class="btn" id="keys">Правильные ответы</button>
          <div style="height:10px"></div>
          <button class="btn" id="again" style="background:linear-gradient(180deg,#e8d4b0,#c9b089);font-size:18px;letter-spacing:.1em">Ещё раз</button>
        </div>
        <a class="ig" href="https://instagram.com/rostov.av" target="_blank" rel="noopener">instagram: rostov.av</a>
      `;
      document.getElementById("keys").onclick = answers;
      document.getElementById("again").onclick = startScreen;
    }

    async function answers() {
      await showBg(photoFor(1));
      const list = round.map((item, n) =>
        `<p><b>${n + 1}.</b> ${item.q}<br>${LETTERS[item.a]}) ${item.options[item.a]}<br>${item.why}</p>`
      ).join("");
      sheet.innerHTML = `
        <div class="author-top">Александр Ростов</div>
        <div class="q-num">ключи</div>
        <div class="rule"></div>
        <div class="answers">${list}</div>
        <button class="btn" id="home" style="margin-top:14px">Начало</button>
        <a class="ig" href="https://instagram.com/rostov.av" target="_blank" rel="noopener">instagram: rostov.av · Александр Ростов</a>
      `;
      document.getElementById("home").onclick = startScreen;
    }

    function verdict(s) {
      if (s === round.length) return "всё верно. редкость.";
      if (s >= 32) return "город знаешь.";
      if (s >= 20) return "середина земли, середина квиза.";
      return "есть куда гулять по улицам.";
    }

    startScreen();
  </script>
</body>
</html>
